# TrustChain server blocks: HTTP redirect, SPA over TLS, API over TLS.

upstream trustchain_api {
    # The backend binds to loopback only. Nginx is the sole public listener.
    server 127.0.0.1:4000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# Port 80 — redirect everything to TLS.
# ---------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name app.example.com api.example.com;

    # The one exception to the redirect. Let's Encrypt validates over plain HTTP, and
    # redirecting this path to a certificate that has not been issued yet is the classic
    # chicken-and-egg failure on first issuance and on every renewal after it.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 301, not 302: a permanent redirect is cached by the browser, so the second visit
    # never leaves in the clear at all. HSTS then covers every visit after the first.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# The single-page app.
# ---------------------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/app.example.com/chain.pem;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    root  /usr/share/nginx/html;
    index index.html;

    limit_conn conns 32;

    # Hashed filenames change whenever content changes, so they can be cached forever.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # index.html is never cached. It names the current bundle, so a cached copy pins users
    # to a build that has been deleted — including a build being replaced to ship a fix.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Client-side routing: unknown paths return the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny the files a build occasionally leaks into a public directory. `.map` is the
    # notable one — a source map republishes the unminified source.
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* \.(?:map|env|bak|log)$ {
        deny all;
    }
}

# ---------------------------------------------------------------------------
# The API.
# ---------------------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.example.com/chain.pem;

    include /etc/nginx/snippets/tls.conf;

    # HSTS is the one header set for both hosts here. Everything else the API returns is
    # set by Helmet in the app, and is deliberately not duplicated: two places setting one
    # header is how one of them silently goes stale.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    limit_conn conns 64;

    # No compression on API responses. See the BREACH note in nginx.conf.
    gzip off;

    location / {
        limit_req zone=api burst=40 nodelay;

        proxy_pass         http://trustchain_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The app reads req.secure from this. It is set, never appended, so a client
        # cannot supply its own value and claim to have arrived over TLS.
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Request-Id      $request_id_final;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        # Longer than the rest: minting waits on IPFS pinning and a relayer round trip.
        proxy_read_timeout    60s;

        # Stream the request through instead of spooling it to disk first, so a large
        # upload cannot fill the proxy's temp directory.
        proxy_request_buffering off;
    }

    # Server-sent events. Every default in the block above is wrong for a long-lived stream.
    #
    #   proxy_buffering      on by default, which holds each frame until the buffer fills.
    #                        A live feed would arrive in batches, minutes late, looking
    #                        exactly like an indexer that had stopped.
    #   proxy_read_timeout   60s above. A stream is idle between events by design, so the
    #                        proxy would cut it every minute and the browser would reconnect
    #                        forever. The app's own keep-alive is well inside this window.
    #   limit_req            a stream is one request that lasts for hours, not a rate. It is
    #                        `limit_conn` in the server block that bounds these.
    #
    # The application also sends `X-Accel-Buffering: no`, which nginx honours. Both are set:
    # the header protects this route behind someone else's proxy, and this block protects it
    # if the header is ever dropped.
    location = /stream {
        proxy_pass         http://trustchain_api/stream;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $request_id_final;

        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding off;

        proxy_connect_timeout 5s;
        proxy_read_timeout    1h;
        proxy_send_timeout    1h;
    }

    # Authentication is the expensive, most-attacked path, so it gets its own bucket.
    # Sharing one zone with the rest of the API would let ordinary browsing exhaust the
    # allowance that is supposed to be slowing down a credential-stuffing run.
    location /auth/ {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass         http://trustchain_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $request_id_final;
    }

    # Kept out of the access log: a liveness probe every few seconds would otherwise be
    # most of the log volume and would push real traffic out of any retention window.
    location = /health {
        access_log off;
        proxy_pass http://trustchain_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
