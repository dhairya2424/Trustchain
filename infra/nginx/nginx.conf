# TrustChain ingress — main Nginx configuration.
#
# Nginx terminates TLS and is the only thing listening on a public port. The Node process
# binds to loopback and is never reachable directly; that is what lets the app treat a
# plain-HTTP request as an anomaly worth refusing (see requireHttps in the backend).

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # JSON access logs to stdout, matching the backend's format so one aggregator query
    # can span both. Writing to a file inside a container produces a second copy nobody
    # ships and nobody rotates.
    log_format json_combined escape=json
      '{'
        '"time":"$time_iso8601",'
        '"level":"info",'
        '"msg":"nginx.request",'
        '"requestId":"$http_x_request_id",'
        '"remoteAddr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"durationMs":$request_time,'
        '"upstreamMs":"$upstream_response_time",'
        '"userAgent":"$http_user_agent",'
        '"tlsVersion":"$ssl_protocol",'
        '"tlsCipher":"$ssl_cipher"'
      '}';

    # Note the absence of $http_authorization, $http_cookie and $args. The backend redacts
    # those; an access log that captured them would undo it.
    access_log  /dev/stdout  json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 4096;

    # Version disclosure tells a scanner which CVEs to try first.
    server_tokens   off;

    # A slow-request DoS (Slowloris) works by holding connections open while dribbling
    # bytes. These are the caps that make it uneconomical.
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          20s;
    client_max_body_size  6m;   # 5 MB upload limit in the API, plus multipart overhead
    large_client_header_buffers 4 8k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/manifest+json image/svg+xml;
    gzip_min_length 1024;
    # BREACH: compressing a response that mixes a secret with attacker-controlled input
    # leaks the secret through its length. API responses are not compressed here at all;
    # only the static bundle is, and it contains no secrets.

    # Rate limits are defined here and applied per-location. Nginx is a coarse first
    # filter that keeps floods off the Node event loop; the per-identity limits that
    # actually matter live in the app, where the caller is known.
    limit_req_zone  $binary_remote_addr zone=api:16m   rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=auth:8m   rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=conns:16m;

    # Give every request an id if the client did not, so the id in the access log, the
    # backend log and the response header is the same one end to end.
    map $http_x_request_id $request_id_final {
        default   $http_x_request_id;
        ""        $request_id;
    }

    include /etc/nginx/conf.d/*.conf;
}
