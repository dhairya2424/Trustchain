# Response headers for the static single-page app.
#
# The API sets its own headers in Express (packages/backend/src/http/securityHeaders.ts) and
# they are NOT duplicated here — two sources setting the same header is how one of them ends
# up stale. `proxy_hide_header` is likewise absent: the backend's headers pass through
# untouched.
#
# `always` on every line, because a header that disappears on a 404 or a 502 is a header
# the browser did not get on exactly the responses an attacker is trying to produce.

# One year, includeSubDomains and preload: the three conditions for hstspreload.org.
# Submitting to the preload list is a commitment — every subdomain, now and in future, must
# be HTTPS-capable, and removal takes months. Do not add `preload` until that is true.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# script-src 'self' with no 'unsafe-inline' and no 'unsafe-eval' is the control that turns
# an HTML injection into a defaced page rather than a session theft: an injected <script>
# has no source the browser will run, and an injected onclick will not fire.
#
# Vite is configured to emit no inline scripts, so no nonce is needed. If that ever changes,
# add a nonce — never 'unsafe-inline'.
#
# connect-src names the API origin explicitly instead of using 'self', so a script that does
# somehow execute still cannot post the data it reads to an arbitrary host.
#
# Substitute the real origins at deploy time; the placeholders below are for the example
# domain and will not work as-is.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://gateway.example-ipfs.cloud; font-src 'self' data:; connect-src 'self' https://api.example.com https://gateway.example-ipfs.cloud; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

# Stops a browser guessing that an uploaded file is HTML and rendering it. Without this,
# content-type confusion turns a file upload into stored XSS.
add_header X-Content-Type-Options "nosniff" always;

# frame-ancestors above is the enforced control; this is its pre-CSP counterpart.
add_header X-Frame-Options "DENY" always;

# strict-origin-when-cross-origin, not no-referrer: the SPA has paths containing token ids
# and DID hashes, and a full URL must not travel to a third-party host.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()" always;

add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# 0 disables the legacy XSS auditor. It is not a typo: the filter is removed from modern
# browsers and its IE/Edge implementation introduced vulnerabilities of its own. CSP is the
# control that replaced it.
add_header X-XSS-Protection "0" always;
