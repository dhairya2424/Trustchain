# TLS parameters, shared by every server block.
#
# Roughly Mozilla's "intermediate" profile, with TLS 1.0 and 1.1 removed: both are
# deprecated by RFC 8996 and fail a PCI scan.

ssl_protocols TLSv1.2 TLSv1.3;

# TLS 1.3 suites are not configurable and are all AEAD. This list is the TLS 1.2 half:
# ECDHE only, so every session has forward secrecy, and AEAD only, so none of the
# CBC-mode padding-oracle families (BEAST, Lucky13) apply. No RSA key exchange, no 3DES,
# no CBC, no SHA-1.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

# Off, deliberately. Every suite above is acceptable, so honouring the client's order lets
# a phone that prefers ChaCha20 (no AES hardware) pick it and stay fast.
ssl_prefer_server_ciphers off;

ssl_ecdh_curve X25519:prime256v1:secp384r1;

ssl_session_timeout 1d;
ssl_session_cache shared:TrustChainTLS:10m;

# Session tickets are encrypted with a key Nginx rotates only on reload, so a key
# compromise would retroactively decrypt captured sessions. That defeats the forward
# secrecy the ECDHE suites above exist to provide.
ssl_session_tickets off;

# 0-RTT data is replayable by design. A replayed mint or role change is not acceptable,
# and the handshake it saves is not worth it.
ssl_early_data off;

ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;
