name: trustchain

services:
  postgres:
    image: postgres:16-alpine
    container_name: trustchain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trustchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trustchain_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-trustchain}
    ports:
      # Overridable: a machine may already run Postgres on 5432, and a published port
      # that silently loses to an existing service sends the app to the wrong database.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trustchain} -d ${POSTGRES_DB:-trustchain}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trustchain-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Overridable for the same reason. An old native Redis on 6379 will shadow this
      # container and answer with a version too old for the commands the API uses.
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  hardhat:
    build:
      context: .
      dockerfile: infra/hardhat/Dockerfile
    container_name: trustchain-hardhat
    restart: unless-stopped
    ports:
      - "${HARDHAT_PORT:-8545}:8545"
    healthcheck:
      test: ["CMD", "node", "/app/infra/healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Self-hosted OpenZeppelin Relayer (v1.5.x), pinned by digest-bearing tag.
  #
  # This is where transactions are signed. The backend holds only an API credential; the
  # signing key lives in this container's mounted keystore and is decrypted with
  # KEYSTORE_PASSPHRASE from infra/relayer/.env. Neither is ever in git.
  #
  # Migrating to AWS KMS means editing infra/relayer/config.template.json to declare an
  # aws_kms signer instead of the local one, regenerating config, and restarting THIS
  # service. The backend does not change.
  #
  # Deliberately NOT exposed beyond the host loopback: the relayer's own documentation
  # says it "is not meant to be directly exposed to the public internet".
  relayer:
    image: openzeppelin/openzeppelin-relayer:v1.5.0
    container_name: trustchain-relayer
    restart: unless-stopped
    depends_on:
      relayer-redis:
        condition: service_healthy
    env_file:
      - infra/relayer/.env
    environment:
      CONFIG_DIR: /app/config
      CONFIG_FILE_NAME: config.json
    volumes:
      # Read-only: the service needs to read its configuration and key, never rewrite them.
      - ./infra/relayer/config:/app/config:ro
    ports:
      # Loopback only. 8081 because 8080 is the local IPFS gateway placeholder.
      - "127.0.0.1:${RELAYER_PORT:-8081}:8080"
    # No healthcheck: the image is a distroless-style build with no shell HTTP client —
    # neither curl nor wget is present — so any `test` we could write here would fail
    # permanently and report the service as unhealthy while it is working fine. Readiness
    # is checked from the host instead, against /api/v1/relayers.

  # The relayer gets its OWN Redis, not a database index on the API's.
  #
  # It stores its transaction queues as Redis Streams with consumer groups. Sharing an
  # instance meant a routine `FLUSHALL` during development silently destroyed those groups:
  # the workers then read nothing, and every submitted transaction stayed "pending" forever
  # with no error anywhere except a stream of "consumer not registered" in the relayer log.
  # A queue that fails silently is worth a container of its own.
  relayer-redis:
    image: redis:7-alpine
    container_name: trustchain-relayer-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - relayer-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  relayer-redis-data:
