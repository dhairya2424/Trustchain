version: 2

updates:
  # Single npm entry: this is an npm-workspaces monorepo, so the root manifest
  # and lockfile govern every package. Per-package entries would fight over the
  # same package-lock.json.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    versioning-strategy: "increase"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Grouped so a weekly bump is one reviewable PR per risk class rather
      # than twenty near-identical ones.
      production-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-minor-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      hardhat-toolchain:
        patterns:
          - "hardhat*"
          - "@nomicfoundation/*"
          - "@typechain/*"
          - "solidity-coverage"
          - "solhint"
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
          - "@vitejs/*"
          - "vite"
          - "vitest"
    ignore:
      # Majors are deliberate migrations, not weekly noise. Hardhat 3 in
      # particular is a config-format rewrite — see docs/SECURITY_BASELINE.md.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
