name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Fails if an ad-hoc pixel font size has crept back in. The type scale erodes one
      # `text-[13px]` at a time, and each one looks harmless in isolation.
      - name: Design system
        run: npm run design:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

  e2e:
    name: browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Chromium only. The suite asserts layout, focus order and layout shift, none of
      # which differ enough between engines to justify tripling the run time on every push;
      # cross-browser belongs in a scheduled job if it is ever wanted.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # No backend, no chain, no database. Every API call is stubbed at the network
      # boundary, so this job needs nothing but a browser — and a failure here is
      # unambiguously a frontend failure rather than an environment one. The claim that the
      # backend behaves correctly is made by tools/e2e-*.mjs against real infrastructure.
      - name: Playwright
        run: npm run e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  contracts:
    name: contracts · coverage · fuzz · slither
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Hard gate: >=90% on every metric globally, and >=90% statements/lines/functions
      # per production contract, so one well-covered file cannot mask a poor one.
      - name: Coverage gate
        run: npm run coverage:check --workspace @trustchain/contracts

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.9.1

      - name: Fuzz and invariant suites
        working-directory: packages/contracts
        run: |
          forge install foundry-rs/forge-std --no-git
          FOUNDRY_PROFILE=ci forge test

      # Hard gate: any HIGH or MEDIUM finding fails the build. Accepted findings are
      # suppressed at the source with `slither-disable-next-line` plus a justification,
      # never by disabling a detector globally — see docs/SLITHER.md.
      - name: Slither
        uses: crytic/slither-action@v0.4.2
        with:
          target: packages/contracts
          fail-on: medium

  supply-chain:
    name: dependency & supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci fails outright if package-lock.json disagrees with any
      # package.json, so this doubles as the lock/manifest sync check.
      - name: Install from lockfile
        run: npm ci

      - name: Lockfile integrity
        run: npm run security:lockfile

      - name: Vulnerability gate
        run: npm audit --audit-level=high

      # Advisory, not blocking: osv-scanner exits non-zero on findings of ANY
      # severity, and the remaining low/moderate findings all sit in the
      # Hardhat 2 build toolchain with no production exposure. Making it a hard
      # gate would leave CI permanently red for issues we have consciously
      # accepted. Tighten to blocking after the Hardhat 3 migration.
      - name: OSV scan (advisory)
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        with:
          scan-args: |-
            --lockfile=package-lock.json

  secrets:
    name: secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: No committed credentials
        run: npm run security:secrets

      # The sql`` tagged template parameterizes by construction; this catches anyone
      # bypassing it with concatenation.
      - name: No string-concatenated SQL
        run: npm run security:sql

      # React escapes by default, so this catches the opt-outs: dangerouslySetInnerHTML,
      # innerHTML assignment, eval and the rest. Zero, or justified with a written reason.
      - name: No unjustified XSS sink
        run: npm run security:xss

      - name: No .env committed
        run: |
          if git ls-files --error-unmatch '**/.env' >/dev/null 2>&1; then
            echo "A .env file is tracked by git."
            exit 1
          fi
          echo "no tracked .env files"

      - name: Frontend bundle carries no server keys
        run: npm run security:bundle

      - name: Security tooling tests
        run: npm run test:tools
