[profile.default]
src = "contracts"
test = "test/foundry"
out = "forge-out"
cache_path = "cache_forge"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# npm workspaces hoist node_modules to the repo root, so OpenZeppelin does not
# live under packages/contracts. allow_paths lets solc read outside this project.
allow_paths = ["../../node_modules"]

remappings = [
  "@openzeppelin/contracts/=../../node_modules/@openzeppelin/contracts/",
  "@openzeppelin/contracts-upgradeable/=../../node_modules/@openzeppelin/contracts-upgradeable/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 32
fail_on_revert = false

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 1024
depth = 64
